# 评测套件注册表
#
# 每个套件声明三件事：
#   project   —— 产物来自哪个仓库（相对本仓库根目录）
#   adapter   —— 用哪个翻译器（evalhub/adapters/<adapter>.py）
#   artifact  —— 读哪个产物；command 非空时先跑 command 再生产物
#
# 约定：evalhub 不关心项目内部怎么跑评测，只认「命令 + 产物」。
# 想换评测实现，改这里，不改 evalhub 代码。

defaults:
  report_dir: reports
  baseline_dir: baselines

suites:
  driver.intent:
    project: ../driver-coupon-refund-agent
    adapter: driver_intent
    artifact: backend/evals/reports/intent_bakeoff_final.json
    # 已有产物就直接读；要重跑就把下面这行解开
    # command: .venv/bin/python -m backend.evals.intent_bakeoff --provider hybrid
    # 报告是历史产物不带 dataset 字段，由 adapter 按这份题目集算指纹
    required_metrics: [accuracy, macro_f1, latency_p95_ms, error_rate]
    options:
      provider: hybrid
      dataset: backend/evals/intent_cases.yml

  rag.ragas:
    project: ../rag-knowledge-base
    adapter: rag_ragas
    # 检索配置消融的产物；换成 evaluation_ablation_dense_only.json 即可对比单路检索
    artifact: evaluation_ablation_full_hybrid.json
    # 跑一次真实评测需要：起服务 + ragas + 模型 key，所以默认只读既有产物
    # command: .venv/bin/python scripts/run_ragas_eval.py
    # 这个套件两种产物格式（RAGAS / 问答闸门）指标集合不同，不用 required 写死
    options:
      dataset: tests/golden_test_set.json

  ride.nl2sql:
    project: ../ride-hailing-analytics-system
    adapter: ride_nl2sql
    artifact: eval/nl2sql/reports/latest.json
    # 无 LLM key 时只校验 gold SQL，有 key 时加 --with-llm 跑真实准确率
    command: .venv/bin/python eval/nl2sql/run_eval.py --seed 42 --json-out eval/nl2sql/reports/latest.json
    # execution_accuracy 在 gold_only 模式下值为 null（合法），但键必须存在
    required_metrics: [gold_pass_rate, execution_accuracy, semantic_accuracy, semantic_coverage]
    options: {}
